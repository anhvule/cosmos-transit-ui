name: iOS — TestFlight

# Triggers:
#   - workflow_dispatch: manual button in the Actions tab (recommended for
#     first runs while you debug signing).
#   - push to main: uncomment once steady-state.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run (beta = TestFlight, release = App Store)'
        required: true
        default: 'beta'
        type: choice
        options: [beta, release]
  # push:
  #   branches: [main]

concurrency:
  group: ios-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # macos-15 image ships with multiple Xcode versions side-by-side; we
    # pin the latest stable via setup-xcode below. Apple requires uploads
    # to be built with a recent Xcode / iOS SDK.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'

      - name: Flutter pub get
        run: flutter pub get

      - name: Precache iOS engine
        run: flutter precache --ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./ios

      # Create a fresh keychain, decode the .p12, import distribution cert
      # + private key. Set the partition list so codesign can use the key
      # without an interactive UI prompt.
      - name: Import distribution certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: 'tempci'
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          P12_PATH="$RUNNER_TEMP/dist.p12"
          echo -n "$P12_BASE64" | base64 -d > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          # Sanity check — should list at least one identity.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # Decode and install the App Store provisioning profile into the
      # canonical location Xcode reads from. Single `Runner` target → one
      # profile.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo -n "$PROFILE_BASE64" | base64 -d \
            > "$PROFILES_DIR/cosmostransit_appstore.mobileprovision"
          ls -la "$PROFILES_DIR"

      - name: Run Fastlane (${{ inputs.lane }})
        working-directory: ./ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # Profile name must match exactly what's inside the .mobileprovision
          # file you imported (e.g. "CosmicTransit App Store CI").
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          # GitHub run number is strictly increasing across all workflows
          # for this repo, so it works as a TestFlight build number.
          BUILD_NUMBER: ${{ github.run_number }}
          # Disable the cocoapods analytics hop in CI.
          COCOAPODS_DISABLE_STATS: 'true'
          CI: 'true'
        run: bundle exec fastlane ${{ inputs.lane || 'beta' }}

      - name: Upload ipa as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-ios-${{ github.run_number }}
          path: ios/build/*.ipa
          if-no-files-found: warn
          retention-days: 14
